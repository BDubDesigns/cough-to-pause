name: train-wake-word
# Verifies the Hey Andy wake-word toolchain (see scripts/wakeword/README.md).
# This job is the CPU *smoke* pipeline: real openWakeWord auto_train + ONNX export on synthetic
# features, ONNX -> TFLite in a separate TensorFlow env, then the Android-contract checks.
# It does NOT train a usable model: that needs a GPU, TTS clips and ~20 GB of negative-speech
# features, which hosted runners do not have.  Use scripts/wakeword/hey_andy_colab.ipynb for that.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/wakeword/**"
      - ".github/workflows/train-wake-word.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install uv
      - name: Smoke pipeline
        run: sh scripts/wakeword/run_pipeline.sh smoke "$RUNNER_TEMP/wakeword"
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p smoke-artifacts
          cp "$RUNNER_TEMP"/wakeword/out/smoke/* "$RUNNER_TEMP"/wakeword/assets/*.tflite smoke-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: wake-word-smoke, path: smoke-artifacts, if-no-files-found: warn }
